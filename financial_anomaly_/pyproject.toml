[project]
name = "realtime-fraud-detector"
version = "0.1.0"
description = "Realtime financial transaction fraud detection platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary,pool]>=3.3,<4",
    "anyio>=4,<5",
    "prometheus-client>=0.21,<1",
    "pydantic>=2.9,<3",
    "torch>=2.5,<3",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
data = ["pandas>=2.2,<3", "numpy>=2,<3"]
training = ["scikit-learn>=1.7,<1.8", "pandas>=2.2,<3", "numpy>=2,<3"]
dev = [
    "scikit-learn>=1.7,<1.8",
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "apps", "scripts", "."]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')"
]

[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fraud_detector", "fraud_detector.features", "fraud_detector.model", "fraud_detector.config", "apps", "apps.audit_store", "apps.traffic_generator"]
package-dir = {fraud_detector = "src/fraud_detector", apps = "apps"}
