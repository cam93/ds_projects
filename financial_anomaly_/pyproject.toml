[project]
name = "realtime-fraud-detector"
version = "0.1.0"
description = "Realtime financial transaction fraud detection platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "kafka-python>=2.0,<3",
    "prometheus-client>=0.21,<1",
    "pydantic-settings>=2.6,<3",
    "torch>=2.5,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "apps"]
