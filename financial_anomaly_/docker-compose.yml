name: realtime-fraud-detector

services:
  traffic-generator:
    image: realtime-fraud-detector-traffic-generator:dev
    build:
      context: .
      dockerfile: deploy/docker/traffic-generator.Dockerfile
    environment:
      TRAFFIC_TARGET_URL: http://api:8000
      TRAFFIC_INTERVAL_SECONDS: 0.25
    depends_on:
      api:
        condition: service_healthy

  api:
    image: realtime-fraud-detector-api:dev
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      AUDIT_SERVICE_URL: http://audit-store:8001
    ports:
      - "8000:8000"
    depends_on:
      audit-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  audit-store:
    image: realtime-fraud-detector-audit-store:dev
    build:
      context: .
      dockerfile: deploy/docker/audit-store.Dockerfile
    environment:
      SQLITE_PATH: /var/lib/fraud-detector/audit.db
    volumes:
      - audit-data:/var/lib/fraud-detector
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy

  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_DASHBOARDS_JSON_ENABLED: "true"
      GF_DASHBOARDS_JSON_PATH: /var/lib/grafana/dashboards
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  audit-data:
