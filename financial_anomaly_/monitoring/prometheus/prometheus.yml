global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: fraud-detector-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_key
    static_configs:
      - targets: [api:8000]
  - job_name: fraud-demo-quality
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_key
    static_configs:
      - targets: [simulator:8002]
